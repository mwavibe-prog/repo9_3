<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Feed Teto - Player</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.screen { display: none; width: 100%; max-width: 500px; padding: 20px; text-align: center; }
.screen.active { display: flex; flex-direction: column; align-items: center; }

/* --- JOIN SCREEN --- */
.join-title {
  font-size: 2.5rem;
  font-weight: 900;
  color: #2e7d32;
  margin-top: 40px;
  margin-bottom: 5px;
}
.join-subtitle {
  color: #666;
  font-size: 1.1rem;
  margin-bottom: 30px;
}
.join-teto {
  font-size: 5rem;
  margin-bottom: 20px;
}
.name-input {
  width: 100%;
  max-width: 350px;
  padding: 18px 25px;
  font-size: 1.5rem;
  border: 3px solid #a5d6a7;
  border-radius: 15px;
  text-align: center;
  outline: none;
  margin-bottom: 20px;
  background: white;
}
.name-input:focus {
  border-color: #4caf50;
  box-shadow: 0 0 0 4px rgba(76,175,80,0.2);
}
.join-btn {
  width: 100%;
  max-width: 350px;
  padding: 20px;
  font-size: 1.8rem;
  font-weight: 900;
  color: white;
  background: linear-gradient(180deg, #4caf50, #388e3c);
  border: none;
  border-radius: 15px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(76,175,80,0.4);
  letter-spacing: 2px;
  transition: transform 0.1s;
}
.join-btn:active { transform: scale(0.95); }

.error-msg {
  color: #d32f2f;
  font-size: 1.1rem;
  margin-top: 15px;
  min-height: 30px;
}

/* --- WAITING SCREEN --- */
.waiting-avatar {
  font-size: 6rem;
  margin: 30px 0 15px;
}
.waiting-name {
  font-size: 1.8rem;
  font-weight: bold;
  color: #333;
  margin-bottom: 10px;
}
.waiting-msg {
  font-size: 1.3rem;
  color: #666;
  margin-bottom: 30px;
}
.start-game-btn {
  width: 100%;
  max-width: 350px;
  padding: 22px;
  font-size: 1.6rem;
  font-weight: 900;
  color: white;
  background: linear-gradient(180deg, #ff9800, #f57c00);
  border: none;
  border-radius: 15px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(255,152,0,0.4);
  letter-spacing: 2px;
  transition: transform 0.1s;
}
.start-game-btn:active { transform: scale(0.95); }
.waiting-dots {
  font-size: 2rem;
  color: #4caf50;
  animation: blink 1.5s infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* --- COUNTDOWN --- */
.phone-countdown {
  font-size: 8rem;
  font-weight: 900;
  color: #2e7d32;
  margin-top: 60px;
  animation: pulse 0.5s ease;
}
@keyframes pulse {
  0% { transform: scale(1.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.phone-countdown-label {
  font-size: 1.5rem;
  color: #555;
  margin-top: 10px;
}

/* --- PLAYING / FOOD CHOICES --- */
.round-label {
  font-size: 1.2rem;
  color: #666;
  margin-top: 10px;
  margin-bottom: 5px;
}
.feed-prompt {
  font-size: 1.6rem;
  font-weight: bold;
  color: #333;
  margin-bottom: 15px;
}
.feed-prompt .food-name {
  color: #2e7d32;
  font-size: 1.8rem;
}
.food-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  width: 100%;
  max-width: 400px;
  margin-bottom: 20px;
}
.food-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 25px 15px;
  border-radius: 20px;
  border: 4px solid transparent;
  cursor: pointer;
  font-size: 1rem;
  font-weight: bold;
  transition: transform 0.1s, border-color 0.1s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.food-btn:active { transform: scale(0.92); }
.food-btn .food-emoji { font-size: 4rem; margin-bottom: 8px; }
.food-btn .food-label { color: #333; font-size: 1.2rem; }
.food-btn.selected { border-color: #4caf50; transform: scale(0.95); }
.food-btn.correct { border-color: #4caf50; background: #c8e6c9 !important; }
.food-btn.wrong { border-color: #f44336; background: #ffcdd2 !important; }

/* --- RESULT FEEDBACK --- */
.result-feedback {
  font-size: 2.5rem;
  font-weight: 900;
  margin: 30px 0;
}
.result-feedback.correct { color: #2e7d32; }
.result-feedback.wrong { color: #d32f2f; }
.result-feedback.timeout { color: #f57c00; }
.result-points {
  font-size: 1.5rem;
  color: #555;
  margin-bottom: 15px;
}
.result-emoji { font-size: 5rem; margin-bottom: 10px; }

/* --- GAME OVER --- */
.phone-gameover-title {
  font-size: 2.2rem;
  font-weight: 900;
  color: #2e7d32;
  margin-top: 30px;
  margin-bottom: 10px;
}
.your-score {
  font-size: 1.8rem;
  color: #333;
  margin-bottom: 25px;
}
.play-again-btn {
  width: 100%;
  max-width: 350px;
  padding: 22px;
  font-size: 1.6rem;
  font-weight: 900;
  color: white;
  background: linear-gradient(180deg, #4caf50, #388e3c);
  border: none;
  border-radius: 15px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(76,175,80,0.4);
  letter-spacing: 2px;
  transition: transform 0.1s;
}
.play-again-btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<!-- JOIN SCREEN -->
<div id="join-screen" class="screen active">
  <div class="join-title">Feed Teto</div>
  <div class="join-subtitle">Enter your name to join the game</div>
  <div class="join-teto">🐸</div>
  <input type="text" id="name-input" class="name-input" placeholder="Your Name" maxlength="15" autocomplete="off">
  <button class="join-btn" id="join-btn">JOIN GAME</button>
  <div class="error-msg" id="error-msg"></div>
</div>

<!-- WAITING SCREEN -->
<div id="waiting-screen" class="screen">
  <div class="waiting-avatar" id="my-avatar">🐸</div>
  <div class="waiting-name" id="my-name">Player</div>
  <div class="waiting-msg">You're in! Look at the TV screen.</div>
  <div class="waiting-dots">...</div>
  <button class="start-game-btn" id="start-game-btn">START GAME</button>
</div>

<!-- COUNTDOWN SCREEN -->
<div id="phone-countdown-screen" class="screen">
  <div class="phone-countdown-label">Get ready!</div>
  <div class="phone-countdown" id="phone-countdown">3</div>
</div>

<!-- PLAYING SCREEN -->
<div id="playing-screen" class="screen">
  <div class="round-label" id="phone-round-label">Round 1 of 10</div>
  <div class="feed-prompt">
    Tap the <span class="food-name" id="phone-food-name">food</span>!
  </div>
  <div class="food-grid" id="food-grid"></div>
</div>

<!-- RESULT SCREEN (between rounds) -->
<div id="result-screen" class="screen">
  <div class="result-emoji" id="result-emoji">✅</div>
  <div class="result-feedback" id="result-feedback">Correct!</div>
  <div class="result-points" id="result-points">+100 points</div>
  <div style="font-size:1.1rem; color:#888;">Next round coming...</div>
</div>

<!-- GAME OVER SCREEN -->
<div id="phone-gameover-screen" class="screen">
  <div class="phone-gameover-title">Game Over!</div>
  <div class="your-score" id="your-score">Your score: 0</div>
  <button class="play-again-btn" id="play-again-btn">PLAY AGAIN</button>
</div>

<script>
(function() {
  const wsProto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const ws = new WebSocket(wsProto + location.host);

  const screens = document.querySelectorAll('.screen');
  function showScreen(id) {
    screens.forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  let myPlayerId = null;
  let myAvatar = '';
  let myName = '';
  let myScore = 0;
  let hasAnswered = false;
  let currentTargetId = null;

  // --- JOIN ---
  const joinBtn = document.getElementById('join-btn');
  const nameInput = document.getElementById('name-input');
  const errorMsg = document.getElementById('error-msg');

  joinBtn.addEventListener('click', joinGame);
  nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinGame(); });

  function joinGame() {
    const name = nameInput.value.trim();
    if (!name) {
      errorMsg.textContent = 'Please enter your name';
      return;
    }
    errorMsg.textContent = '';
    myName = name;
    ws.send(JSON.stringify({ type: 'playerJoin', name }));
  }

  // --- START GAME ---
  document.getElementById('start-game-btn').addEventListener('click', () => {
    ws.send(JSON.stringify({ type: 'startGame' }));
  });

  // --- PLAY AGAIN ---
  document.getElementById('play-again-btn').addEventListener('click', () => {
    ws.send(JSON.stringify({ type: 'startGame' }));
  });

  // --- WEBSOCKET MESSAGES ---
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    switch (msg.type) {
      case 'joined':
        myPlayerId = msg.playerId;
        myAvatar = msg.avatar;
        myName = msg.name;
        document.getElementById('my-avatar').textContent = msg.avatar;
        document.getElementById('my-name').textContent = msg.name;
        showScreen('waiting-screen');
        break;

      case 'error':
        errorMsg.textContent = msg.message;
        break;

      case 'gameState':
        if (msg.state === 'lobby' && myPlayerId) {
          showScreen('waiting-screen');
          // Update own score from state
          const me = msg.players.find(p => p.name === myName);
          if (me) myScore = me.score;
        }
        break;

      case 'countdown': {
        showScreen('phone-countdown-screen');
        const el = document.getElementById('phone-countdown');
        el.textContent = msg.count;
        el.style.animation = 'none';
        void el.offsetHeight;
        el.style.animation = 'pulse 0.5s ease';
        break;
      }

      case 'roundStart':
        handleRoundStart(msg);
        break;

      case 'roundEnd':
        handleRoundEnd(msg);
        break;

      case 'gameOver':
        handleGameOver(msg);
        break;
    }
  };

  function handleRoundStart(msg) {
    showScreen('playing-screen');
    hasAnswered = false;
    currentTargetId = msg.targetFood.id;

    document.getElementById('phone-round-label').textContent =
      `Round ${msg.round} of ${msg.maxRounds}`;
    document.getElementById('phone-food-name').textContent = msg.targetFood.name;

    const grid = document.getElementById('food-grid');
    grid.innerHTML = '';
    msg.choices.forEach(food => {
      const btn = document.createElement('button');
      btn.className = 'food-btn';
      btn.style.background = food.color;
      btn.dataset.foodId = food.id;
      btn.innerHTML =
        `<span class="food-emoji">${food.emoji}</span>` +
        `<span class="food-label">${food.name}</span>`;
      btn.addEventListener('click', () => selectFood(food.id, btn));
      grid.appendChild(btn);
    });
  }

  function selectFood(foodId, btnEl) {
    if (hasAnswered) return;
    hasAnswered = true;

    // Highlight selection
    document.querySelectorAll('.food-btn').forEach(b => b.style.pointerEvents = 'none');
    btnEl.classList.add('selected');

    ws.send(JSON.stringify({ type: 'answer', foodId }));

    // Show immediate feedback
    setTimeout(() => {
      if (foodId === currentTargetId) {
        btnEl.classList.add('correct');
      } else {
        btnEl.classList.add('wrong');
        // Highlight the correct one
        document.querySelectorAll('.food-btn').forEach(b => {
          if (b.dataset.foodId === currentTargetId) b.classList.add('correct');
        });
      }
    }, 300);
  }

  function handleRoundEnd(msg) {
    // Find my result
    const myResult = msg.results.find(r => r.name === myName);
    const emojiEl = document.getElementById('result-emoji');
    const fbEl = document.getElementById('result-feedback');
    const ptsEl = document.getElementById('result-points');

    if (!myResult || myResult.timeout) {
      emojiEl.textContent = '⏰';
      fbEl.textContent = 'Too slow!';
      fbEl.className = 'result-feedback timeout';
      ptsEl.textContent = '0 points';
    } else if (myResult.correct) {
      emojiEl.textContent = '✅';
      fbEl.textContent = 'Correct!';
      fbEl.className = 'result-feedback correct';
      ptsEl.textContent = `+${myResult.points} points`;
    } else {
      emojiEl.textContent = '❌';
      fbEl.textContent = 'Wrong!';
      fbEl.className = 'result-feedback wrong';
      ptsEl.textContent = '0 points';
    }

    // Update score
    const me = msg.leaderboard.find(p => p.name === myName);
    if (me) myScore = me.score;

    showScreen('result-screen');
  }

  function handleGameOver(msg) {
    const me = msg.leaderboard.find(p => p.name === myName);
    if (me) myScore = me.score;
    document.getElementById('your-score').textContent = `Your score: ${myScore}`;
    showScreen('phone-gameover-screen');
  }

  ws.onclose = () => {
    errorMsg.textContent = 'Disconnected from server. Please refresh.';
    showScreen('join-screen');
  };
})();
</script>
</body>
</html>
