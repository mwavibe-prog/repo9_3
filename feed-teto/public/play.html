<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Feed Teto - Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;min-height:100vh;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);display:flex;flex-direction:column;align-items:center;color:#333;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.screen{display:none;width:100%;max-width:500px;padding:20px;text-align:center;flex-direction:column;align-items:center}
.screen.active{display:flex}
.join-teto{font-size:5rem;margin:20px 0 8px}
.join-title{font-size:2.2rem;font-weight:900;color:#2e7d32;margin-bottom:5px}
.join-sub{color:#666;font-size:1.1rem;margin-bottom:20px}
.inp{width:100%;max-width:320px;padding:16px 22px;font-size:1.5rem;border:3px solid #a5d6a7;border-radius:15px;text-align:center;outline:none;background:white;margin-bottom:14px}
.inp:focus{border-color:#4caf50;box-shadow:0 0 0 4px rgba(76,175,80,0.2)}
.big-btn{width:100%;max-width:320px;padding:18px;font-size:1.6rem;font-weight:900;color:white;border:none;border-radius:15px;cursor:pointer;letter-spacing:2px;transition:transform .1s}
.big-btn:active{transform:scale(.95)}
.btn-green{background:linear-gradient(180deg,#4caf50,#388e3c);box-shadow:0 6px 20px rgba(76,175,80,0.4)}
.btn-orange{background:linear-gradient(180deg,#ff9800,#f57c00);box-shadow:0 6px 20px rgba(255,152,0,0.4)}
.err{color:#d32f2f;font-size:1rem;margin-top:10px;min-height:24px}
.w-avatar{font-size:5rem;margin:20px 0 8px}
.w-name{font-size:1.6rem;font-weight:bold;margin-bottom:4px}
.w-msg{font-size:1.2rem;color:#666;margin-bottom:16px}
.dots{font-size:2rem;color:#4caf50;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.ph-cd{font-size:10rem;font-weight:900;color:#2e7d32;margin-top:30px;animation:pulse .5s ease}
.ph-cd-label{font-size:1.5rem;color:#555;margin-top:30px}
@keyframes pulse{0%{transform:scale(1.5);opacity:0}100%{transform:scale(1);opacity:1}}
.round-lbl{font-size:1.1rem;color:#666;margin-top:8px;margin-bottom:4px}
.feed-prompt{font-size:1.5rem;font-weight:bold;margin-bottom:14px}
.feed-prompt .fn{color:#2e7d32;font-size:1.7rem}
.food-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:380px;margin-bottom:16px}
.food-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 12px;border-radius:18px;border:4px solid transparent;cursor:pointer;font-size:1rem;font-weight:bold;background:white;box-shadow:0 4px 15px rgba(0,0,0,0.08);transition:transform .1s,border-color .1s}
.food-btn:active{transform:scale(.93)}
.food-btn .fe{font-size:3.5rem;margin-bottom:6px}
.food-btn .fl{color:#333;font-size:1.2rem}
.food-btn.selected{border-color:#4caf50;transform:scale(.95)}
.food-btn.correct{border-color:#4caf50;background:#c8e6c9!important}
.food-btn.wrong{border-color:#f44336;background:#ffcdd2!important}
.res-emoji{font-size:5rem;margin:20px 0 8px}
.res-fb{font-size:2.4rem;font-weight:900;margin-bottom:8px}
.res-fb.ok{color:#2e7d32}
.res-fb.no{color:#d32f2f}
.res-fb.to{color:#f57c00}
.res-pts{font-size:1.4rem;color:#555;margin-bottom:10px}
.go-title{font-size:2.2rem;font-weight:900;color:#2e7d32;margin-top:25px;margin-bottom:8px}
.go-score{font-size:1.6rem;margin-bottom:18px}
</style>
</head>
<body>

<div id="s-join" class="screen active">
  <div class="join-teto">🐸</div>
  <div class="join-title">Feed Teto</div>
  <div class="join-sub">Enter your name to join!</div>
  <input type="text" id="inp-name" class="inp" placeholder="Your Name" maxlength="15" autocomplete="off">
  <input type="text" id="inp-room" class="inp" placeholder="Room Code (4 digits)" maxlength="4" inputmode="numeric" autocomplete="off">
  <button class="big-btn btn-green" id="btn-join">JOIN GAME</button>
  <div class="err" id="err"></div>
</div>

<div id="s-wait" class="screen">
  <div class="w-avatar" id="my-av">🐸</div>
  <div class="w-name" id="my-nm">Player</div>
  <div class="w-msg">You're in! Look at the TV screen.</div>
  <div class="dots">. . .</div>
  <button class="big-btn btn-orange" id="btn-start">START GAME</button>
</div>

<div id="s-cd" class="screen">
  <div class="ph-cd-label">Get Ready!</div>
  <div class="ph-cd" id="ph-cd">3</div>
</div>

<div id="s-play" class="screen">
  <div class="round-lbl" id="ph-round">Round 1 of 10</div>
  <div class="feed-prompt">Tap the <span class="fn" id="ph-fn">food</span>!</div>
  <div class="food-grid" id="food-grid"></div>
</div>

<div id="s-result" class="screen">
  <div class="res-emoji" id="res-emoji">✅</div>
  <div class="res-fb" id="res-fb">Correct!</div>
  <div class="res-pts" id="res-pts">+100 points</div>
  <div style="font-size:1rem;color:#888">Next round coming...</div>
</div>

<div id="s-go" class="screen">
  <div class="go-title">Game Over!</div>
  <div class="go-score" id="go-score">Your score: 0</div>
  <div style="color:#888;margin-bottom:18px">Look at the TV for results!</div>
  <button class="big-btn btn-green" id="btn-again">PLAY AGAIN</button>
</div>

<script>
(function(){
  var ws, myId, myName, myScore=0, hasAnswered=false, currentTargetId;

  var scrs=document.querySelectorAll('.screen');
  function show(id){for(var i=0;i<scrs.length;i++)scrs[i].classList.remove('active');document.getElementById(id).classList.add('active');}

  // Get room from URL if present
  var params = new URLSearchParams(window.location.search);
  var urlRoom = params.get('room');
  if (urlRoom) document.getElementById('inp-room').value = urlRoom;

  document.getElementById('btn-join').onclick = joinGame;
  document.getElementById('inp-name').onkeydown = function(e){if(e.key==='Enter')joinGame()};
  document.getElementById('btn-start').onclick = function(){if(ws)ws.send(JSON.stringify({type:'startGame'}))};
  document.getElementById('btn-again').onclick = function(){if(ws)ws.send(JSON.stringify({type:'startGame'}))};

  function joinGame(){
    var name=document.getElementById('inp-name').value.trim();
    var room=document.getElementById('inp-room').value.trim();
    if(!name){document.getElementById('err').textContent='Please enter your name';return;}
    if(!room||room.length!==4){document.getElementById('err').textContent='Enter the 4-digit room code from the TV';return;}
    document.getElementById('err').textContent='';
    myName=name;
    var proto=location.protocol==='https:'?'wss://':'ws://';
    ws=new WebSocket(proto+location.host);
    ws.onopen=function(){ws.send(JSON.stringify({type:'playerJoin',name:name,room:room}))};
    ws.onmessage=onMsg;
    ws.onerror=function(){};
    ws.onclose=function(){document.getElementById('err').textContent='Disconnected. Refresh to rejoin.';show('s-join')};
  }

  function onMsg(e){
    var msg=JSON.parse(e.data);
    switch(msg.type){
      case 'joined':
        myId=msg.playerId;myName=msg.name;
        document.getElementById('my-av').textContent=msg.avatar;
        document.getElementById('my-nm').textContent=msg.name;
        show('s-wait');break;
      case 'error':
        document.getElementById('err').textContent=msg.message;break;
      case 'gameState':
        if(msg.state==='lobby'&&myId)show('s-wait');
        var me=msg.players.find(function(p){return p.name===myName});
        if(me)myScore=me.score;
        break;
      case 'countdown':
        show('s-cd');var el=document.getElementById('ph-cd');el.textContent=msg.count;
        el.style.animation='none';void el.offsetHeight;el.style.animation='pulse .5s ease';break;
      case 'roundStart':handleRound(msg);break;
      case 'roundEnd':handleRoundEnd(msg);break;
      case 'gameOver':handleGO(msg);break;
    }
  }

  function handleRound(msg){
    show('s-play');hasAnswered=false;
    currentTargetId=msg.targetFood.id;
    document.getElementById('ph-round').textContent='Round '+msg.round+' of '+msg.maxRounds;
    document.getElementById('ph-fn').textContent=msg.targetFood.name;
    var grid=document.getElementById('food-grid');grid.innerHTML='';
    msg.choices.forEach(function(food){
      var btn=document.createElement('button');
      btn.className='food-btn';btn.dataset.fid=food.id;
      btn.innerHTML='<span class="fe">'+food.emoji+'</span><span class="fl">'+food.name+'</span>';
      btn.onclick=function(){selectFood(food.id,btn)};
      grid.appendChild(btn);
    });
  }

  function selectFood(fid,btn){
    if(hasAnswered)return;hasAnswered=true;
    document.querySelectorAll('.food-btn').forEach(function(b){b.style.pointerEvents='none'});
    btn.classList.add('selected');
    ws.send(JSON.stringify({type:'answer',foodId:fid}));
    setTimeout(function(){
      if(fid===currentTargetId){btn.classList.add('correct')}
      else{btn.classList.add('wrong');document.querySelectorAll('.food-btn').forEach(function(b){if(b.dataset.fid===currentTargetId)b.classList.add('correct')})}
    },300);
  }

  function handleRoundEnd(msg){
    var my=msg.results.find(function(r){return r.name===myName});
    var emoji=document.getElementById('res-emoji');
    var fb=document.getElementById('res-fb');
    var pts=document.getElementById('res-pts');
    if(!my||my.timeout){emoji.textContent='⏰';fb.textContent='Too slow!';fb.className='res-fb to';pts.textContent='0 points'}
    else if(my.correct){emoji.textContent='✅';fb.textContent='Correct!';fb.className='res-fb ok';pts.textContent='+'+my.points+' points'}
    else{emoji.textContent='❌';fb.textContent='Wrong!';fb.className='res-fb no';pts.textContent='0 points'}
    var me=msg.leaderboard.find(function(p){return p.name===myName});
    if(me)myScore=me.score;
    show('s-result');
  }

  function handleGO(msg){
    var me=msg.leaderboard.find(function(p){return p.name===myName});
    if(me)myScore=me.score;
    document.getElementById('go-score').textContent='Your score: '+myScore;
    show('s-go');
  }
})();
</script>
</body>
</html>
