<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Drop Frogs - Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;min-height:100vh;background:linear-gradient(135deg,#0a1628,#1a2a4a);display:flex;flex-direction:column;align-items:center;color:#e0e0e0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.screen{display:none;width:100%;max-width:500px;padding:15px;text-align:center;flex-direction:column;align-items:center}
.screen.active{display:flex}
.join-teto{font-size:5rem;margin:30px 0 10px}
.join-title{font-size:2.2rem;font-weight:900;color:#7cff7c;margin-bottom:5px}
.join-sub{color:#aaa;font-size:1.1rem;margin-bottom:25px}
.name-input{width:100%;max-width:320px;padding:16px 22px;font-size:1.5rem;border:3px solid #4a8;border-radius:15px;text-align:center;outline:none;background:#1a2a4a;color:#fff;margin-bottom:18px}
.name-input:focus{border-color:#7cff7c;box-shadow:0 0 0 4px rgba(124,255,124,0.2)}
.name-input::placeholder{color:#668}
.big-btn{width:100%;max-width:320px;padding:18px;font-size:1.6rem;font-weight:900;color:#fff;border:none;border-radius:15px;cursor:pointer;letter-spacing:2px}
.big-btn:active{transform:scale(.95)}
.btn-green{background:linear-gradient(180deg,#4caf50,#388e3c);box-shadow:0 6px 20px rgba(76,175,80,0.4)}
.btn-orange{background:linear-gradient(180deg,#ff9800,#f57c00);box-shadow:0 6px 20px rgba(255,152,0,0.4)}
.error-msg{color:#f44336;font-size:1rem;margin-top:12px;min-height:24px}
.w-avatar{font-size:5rem;margin:25px 0 10px}
.w-name{font-size:1.6rem;font-weight:bold;margin-bottom:6px}
.w-msg{font-size:1.2rem;color:#aaa;margin-bottom:20px}
.dots{font-size:2rem;color:#7cff7c;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.ph-cd-label{font-size:1.5rem;color:#aaa;margin-top:40px}
.ph-cd{font-size:10rem;font-weight:900;color:#7cff7c;animation:pulse .5s ease}
@keyframes pulse{0%{transform:scale(1.5);opacity:0}100%{transform:scale(1);opacity:1}}
.play-hud{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:420px;margin-bottom:6px;font-size:.9rem;color:#aaa;gap:8px}
.play-hud .sc{color:#7cff7c;font-weight:900;font-size:1.1rem}
.play-hud .best{color:#ffd54f;font-weight:700;font-size:.85rem}
#gc{display:block;border:2px solid #4a8;border-radius:8px;background:#0a0f1a;touch-action:none}
.play-controls{display:flex;gap:10px;margin-top:8px;width:100%;max-width:420px;justify-content:space-between;align-items:center}
.undo-btn{padding:10px 20px;font-size:1rem;font-weight:700;color:#fff;background:linear-gradient(180deg,#78909c,#546e7a);border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:6px;opacity:0.5;transition:opacity .2s}
.undo-btn.has-undo{opacity:1}
.undo-btn:active{transform:scale(.93)}
.undo-badge{background:rgba(255,255,255,0.25);border-radius:8px;padding:1px 6px;font-size:.75rem}
.drag-hint{font-size:.78rem;color:#6a8}
.ph-go-title{font-size:2.2rem;font-weight:900;color:#7cff7c;margin-top:30px;margin-bottom:8px}
.ph-score{font-size:1.6rem;margin-bottom:8px}
.ph-best{font-size:1.1rem;color:#ffd54f;margin-bottom:20px}
</style>
</head>
<body>

<div id="s-join" class="screen active">
  <div class="join-teto">🐸</div>
  <div class="join-title">Drop Frogs</div>
  <div class="join-sub">Enter your name to play!</div>
  <input type="text" id="name-input" class="name-input" placeholder="Your Name" maxlength="15" autocomplete="off">
  <button class="big-btn btn-green" id="btn-join">JOIN GAME</button>
  <button class="big-btn btn-orange" id="btn-solo" style="margin-top:12px;display:none">PLAY SOLO</button>
  <div class="error-msg" id="err-msg"></div>
</div>

<div id="s-waiting" class="screen">
  <div class="w-avatar" id="my-avatar">🐸</div>
  <div class="w-name" id="my-name">Player</div>
  <div class="w-msg">You're in! Look at the TV.</div>
  <div class="dots">. . .</div>
  <button class="big-btn btn-orange" id="btn-start">START GAME</button>
</div>

<div id="s-cd" class="screen">
  <div class="ph-cd-label">Get Ready!</div>
  <div class="ph-cd" id="ph-cd">3</div>
</div>

<div id="s-play" class="screen">
  <div class="play-hud">
    <div>Score: <span class="sc" id="ph-score">0</span></div>
    <div class="best">Best: <span id="ph-best">0</span></div>
    <div id="ph-timer" style="color:#7cff7c;font-weight:bold">2:00</div>
  </div>
  <canvas id="gc"></canvas>
  <div class="play-controls">
    <button class="undo-btn" id="btn-undo">↩ Undo <span class="undo-badge" id="undo-count">0</span></button>
    <div class="drag-hint">Drag the frog or tap a column</div>
  </div>
</div>

<div id="s-go" class="screen">
  <div class="ph-go-title">Time's Up!</div>
  <div class="ph-score" id="ph-final">Your score: 0</div>
  <div class="ph-best" id="ph-final-best">Best: 0</div>
  <div style="color:#aaa;margin-bottom:20px">Look at the TV for results!</div>
  <button class="big-btn btn-green" id="btn-again">PLAY AGAIN</button>
</div>

<script src="frog-engine.js"></script>
<script>
(function(){
"use strict";
var ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
var myId=null, myName='', myAvatar='';
var scrs = document.querySelectorAll('.screen');
function showScr(id){for(var i=0;i<scrs.length;i++)scrs[i].classList.remove('active');document.getElementById(id).classList.add('active');}

document.getElementById('btn-join').onclick = joinGame;
document.getElementById('name-input').onkeydown = function(e){if(e.key==='Enter')joinGame()};
document.getElementById('btn-start').onclick = function(){ws.send(JSON.stringify({type:'startGame'}))};
document.getElementById('btn-again').onclick = function(){ws.send(JSON.stringify({type:'startGame'}))};

function joinGame(){
  var n=document.getElementById('name-input').value.trim();
  if(!n){document.getElementById('err-msg').textContent='Please enter your name';return;}
  document.getElementById('err-msg').textContent='';
  myName=n; ws.send(JSON.stringify({type:'playerJoin',name:n}));
}

var engine = null;
var reportThrottle = 0;

function reportScore(){
  if(!myId||!engine)return;
  var now=performance.now();
  if(now-reportThrottle<400)return;
  reportThrottle=now;
  document.getElementById('ph-score').textContent=engine.score;
  document.getElementById('ph-best').textContent=engine.bestScore;
  ws.send(JSON.stringify({type:'scoreUpdate',score:engine.score,board:engine.getBoard()}));
}

// Undo button
document.getElementById('btn-undo').onclick = function(){
  if(engine) engine.undo();
};

ws.onmessage = function(e){
  var msg=JSON.parse(e.data);
  switch(msg.type){
    case 'joined':
      myId=msg.playerId;myAvatar=msg.avatar;myName=msg.name;
      document.getElementById('my-avatar').textContent=msg.avatar;
      document.getElementById('my-name').textContent=msg.name;
      showScr('s-waiting');break;
    case 'error':
      document.getElementById('err-msg').textContent=msg.message;break;
    case 'gameState':
      if(msg.state==='lobby'&&myId)showScr('s-waiting');break;
    case 'countdown':
      showScr('s-cd');var el=document.getElementById('ph-cd');el.textContent=msg.count;
      el.style.animation='none';void el.offsetHeight;el.style.animation='pulse .5s ease';break;
    case 'gameStart':
      showScr('s-play');
      engine = new FrogEngine(document.getElementById('gc'), reportScore);
      engine.onUndoChange = function(count){
        document.getElementById('undo-count').textContent = count;
        var btn = document.getElementById('btn-undo');
        if(count > 0) btn.classList.add('has-undo'); else btn.classList.remove('has-undo');
      };
      engine.onGameOver = function(){
        reportScore();
      };
      document.getElementById('ph-best').textContent = engine.bestScore;
      engine.start();
      break;
    case 'timeUpdate':
      var s=Math.ceil(msg.timeLeft/1000),m=Math.floor(s/60),ss=s%60;
      document.getElementById('ph-timer').textContent=m+':'+(ss<10?'0':'')+ss;
      if(s<=0&&engine&&engine.active){engine.stop();reportScore();}break;
    case 'gameOver':
      if(engine){engine.stop();reportScore();}
      document.getElementById('ph-final').textContent='Your score: '+(engine?engine.score:0);
      document.getElementById('ph-final-best').textContent='Best: '+(engine?engine.bestScore:0);
      showScr('s-go');break;
  }
};
ws.onerror=function(){};
ws.onclose=function(){
  document.getElementById('err-msg').textContent='No server found.';
  document.getElementById('btn-solo').style.display='';
  document.getElementById('btn-join').style.display='none';
  showScr('s-join');
};

// --- SOLO PLAY (no server needed) ---
function startSolo() {
  showScr('s-play');
  document.getElementById('ph-timer').textContent='Solo';
  engine = new FrogEngine(document.getElementById('gc'), function(){
    document.getElementById('ph-score').textContent=engine.score;
    document.getElementById('ph-best').textContent=engine.bestScore;
  });
  engine.onUndoChange = function(count){
    document.getElementById('undo-count').textContent=count;
    var btn=document.getElementById('btn-undo');
    if(count>0) btn.classList.add('has-undo'); else btn.classList.remove('has-undo');
  };
  engine.onGameOver = function(){
    document.getElementById('ph-final').textContent='Your score: '+engine.score;
    document.getElementById('ph-final-best').textContent='Best: '+engine.bestScore;
    showScr('s-go');
  };
  document.getElementById('ph-best').textContent=engine.bestScore;
  engine.start();
}
document.getElementById('btn-solo').onclick=startSolo;
document.getElementById('btn-again').onclick=function(){
  if(ws.readyState===1) ws.send(JSON.stringify({type:'startGame'}));
  else startSolo();
};
})();
</script>
</body>
</html>
